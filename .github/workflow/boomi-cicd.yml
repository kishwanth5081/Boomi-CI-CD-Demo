name: Boomi CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/deployment-manifest.json'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  boomi-deploy:
    name: Deploy Boomi Process
    runs-on: ubuntu-latest

    env:
      BOOMI_API_URL: ${{ secrets.BOOMI_API_URL }}
      BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
      BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
      BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
      BOOMI_COMPONENT_ID: ${{ secrets.BOOMI_COMPONENT_ID }}
      BOOMI_ENVIRONMENT_ID: ${{ secrets.BOOMI_ENVIRONMENT_ID }}
      BOOMI_ATOM_ID: ${{ secrets.BOOMI_ATOM_ID }}

    steps:

      # ---------------------------------------------------------
      # STEP 1 - Checkout Repository
      # ---------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # STEP 2 - Install jq
      # ---------------------------------------------------------
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      # ---------------------------------------------------------
      # STEP 3 - Validate Deployment Manifest
      # ---------------------------------------------------------
      - name: Validate Deployment Manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="deploy/deployment-manifest.json"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: $MANIFEST not found"
            exit 1
          fi

          echo "Validating JSON..."

          jq empty "$MANIFEST"

          RELEASE=$(jq -r '.release' "$MANIFEST")
          PROCESS=$(jq -r '.process' "$MANIFEST")
          DESCRIPTION=$(jq -r '.description // ""' "$MANIFEST")

          if [ "$RELEASE" = "null" ] || [ -z "$RELEASE" ]; then
            echo "ERROR: release is missing"
            exit 1
          fi

          if [ "$PROCESS" = "null" ] || [ -z "$PROCESS" ]; then
            echo "ERROR: process is missing"
            exit 1
          fi

          echo "Release      : $RELEASE"
          echo "Process      : $PROCESS"
          echo "Description  : $DESCRIPTION"

          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "process=$PROCESS" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # STEP 4 - Validate Required Secrets
      # ---------------------------------------------------------
      - name: Validate Boomi Configuration
        shell: bash
        run: |
          set -euo pipefail

          required_vars=(
            BOOMI_API_URL
            BOOMI_ACCOUNT_ID
            BOOMI_USERNAME
            BOOMI_API_TOKEN
            BOOMI_COMPONENT_ID
            BOOMI_ENVIRONMENT_ID
            BOOMI_ATOM_ID
          )

          for variable in "${required_vars[@]}"; do
            if [ -z "${!variable:-}" ]; then
              echo "ERROR: $variable is not configured"
              exit 1
            fi
          done

          echo "All required Boomi configuration values are available."

      # ---------------------------------------------------------
      # STEP 5 - Deploy Boomi Process
      #
      # Boomi DeployedPackage API:
      #
      # environmentId + componentId
      #
      # This tells Boomi to package the component and deploy it
      # to the specified environment.
      # ---------------------------------------------------------
      - name: Package and Deploy Boomi Process
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="deploy/deployment-manifest.json"

          RELEASE="${{ steps.manifest.outputs.release }}"
          PROCESS="${{ steps.manifest.outputs.process }}"

          echo "=========================================="
          echo "Boomi Deployment"
          echo "=========================================="
          echo "Process     : $PROCESS"
          echo "Release     : $RELEASE"
          echo "Environment : $BOOMI_ENVIRONMENT_ID"
          echo "Component   : $BOOMI_COMPONENT_ID"
          echo "=========================================="

          DEPLOY_PAYLOAD=$(jq -n \
            --arg environmentId "$BOOMI_ENVIRONMENT_ID" \
            --arg componentId "$BOOMI_COMPONENT_ID" \
            --arg packageVersion "$RELEASE" \
            --arg notes "GitHub Actions deployment - $GITHUB_SHA" \
            '{
              "@type": "DeployedPackage",
              "environmentId": $environmentId,
              "componentId": $componentId,
              "packageVersion": $packageVersion,
              "notes": $notes
            }')

          echo "Calling Boomi DeployedPackage API..."

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --write-out "%{http_code}" \
            --output deploy-response.json \
            --user "$BOOMI_USERNAME:$BOOMI_API_TOKEN" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --request POST \
            "$BOOMI_API_URL/$BOOMI_ACCOUNT_ID/DeployedPackage" \
            --data "$DEPLOY_PAYLOAD")

          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Boomi deployment failed."
            cat deploy-response.json
            exit 1
          fi

          echo "Boomi deployment API completed successfully."

          cat deploy-response.json | jq .

          DEPLOYMENT_ID=$(jq -r '.deploymentId // empty' deploy-response.json)
          PACKAGE_ID=$(jq -r '.packageId // empty' deploy-response.json)
          PACKAGE_VERSION=$(jq -r '.packageVersion // empty' deploy-response.json)

          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "ERROR: deploymentId was not returned by Boomi."
            exit 1
          fi

          echo "Deployment ID : $DEPLOYMENT_ID"
          echo "Package ID    : $PACKAGE_ID"
          echo "Package Ver   : $PACKAGE_VERSION"

          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "package_id=$PACKAGE_ID" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # STEP 6 - Wait after Deployment
      # ---------------------------------------------------------
      - name: Wait for Boomi Deployment
        run: |
          echo "Waiting for Boomi deployment to become available..."
          sleep 15

      # ---------------------------------------------------------
      # STEP 7 - Execute Process
      #
      # This creates a Boomi ExecutionRequest.
      # The returned requestId is used to obtain the Process Report.
      # ---------------------------------------------------------
      - name: Execute Boomi Process
        id: execute
        shell: bash
        run: |
          set -euo pipefail

          PROCESS="${{ steps.manifest.outputs.process }}"

          echo "=========================================="
          echo "Executing Boomi Process"
          echo "=========================================="
          echo "Process : $PROCESS"
          echo "Atom    : $BOOMI_ATOM_ID"
          echo "=========================================="

          EXECUTION_PAYLOAD=$(jq -n \
            --arg atomId "$BOOMI_ATOM_ID" \
            --arg processId "$BOOMI_COMPONENT_ID" \
            '{
              "@type": "ExecutionRequest",
              "atomId": $atomId,
              "processId": $processId
            }')

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --write-out "%{http_code}" \
            --output execution-response.json \
            --user "$BOOMI_USERNAME:$BOOMI_API_TOKEN" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --request POST \
            "$BOOMI_API_URL/$BOOMI_ACCOUNT_ID/ExecutionRequest" \
            --data "$EXECUTION_PAYLOAD")

          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Process execution request failed."
            cat execution-response.json
            exit 1
          fi

          cat execution-response.json | jq .

          REQUEST_ID=$(jq -r '.requestId // empty' execution-response.json)

          if [ -z "$REQUEST_ID" ]; then
            echo "ERROR: requestId was not returned."
            exit 1
          fi

          echo "Boomi Execution Request ID: $REQUEST_ID"

          echo "request_id=$REQUEST_ID" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # STEP 8 - Poll Process Report
      # ---------------------------------------------------------
      - name: Get Boomi Process Report
        id: report
        shell: bash
        run: |
          set -euo pipefail

          REQUEST_ID="${{ steps.execute.outputs.request_id }}"

          echo "=========================================="
          echo "Waiting for Boomi Process Report"
          echo "=========================================="
          echo "Request ID: $REQUEST_ID"
          echo "=========================================="

          MAX_ATTEMPTS=30
          SLEEP_SECONDS=10

          for ((i=1; i<=MAX_ATTEMPTS; i++)); do

            echo ""
            echo "Attempt $i/$MAX_ATTEMPTS"

            HTTP_STATUS=$(curl \
              --silent \
              --show-error \
              --write-out "%{http_code}" \
              --output report-response.json \
              --user "$BOOMI_USERNAME:$BOOMI_API_TOKEN" \
              --header "Accept: application/json" \
              --request GET \
              "$BOOMI_API_URL/$BOOMI_ACCOUNT_ID/ExecutionRecord/$REQUEST_ID")

            echo "HTTP Status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" = "202" ]; then
              echo "Execution report is not available yet."
              sleep "$SLEEP_SECONDS"
              continue
            fi

            if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
              echo "Failed to retrieve execution report."
              cat report-response.json
              exit 1
            fi

            STATUS=$(jq -r '.status // "UNKNOWN"' report-response.json)

            echo "Process Status: $STATUS"

            jq '{
              executionId,
              processId,
              processName,
              atomId,
              executionTime,
              recordedDate,
              status,
              executionDuration,
              inboundDocumentCount,
              inboundErrorDocumentCount,
              outboundDocumentCount,
              message
            }' report-response.json

            case "$STATUS" in

              COMPLETE)
                echo ""
                echo "=========================================="
                echo "SUCCESS: Boomi Process Completed"
                echo "=========================================="

                echo "status=$STATUS" >> "$GITHUB_OUTPUT"
                exit 0
                ;;

              COMPLETE_WARN)
                echo ""
                echo "=========================================="
                echo "WARNING: Boomi Process Completed With Warnings"
                echo "=========================================="

                echo "status=$STATUS" >> "$GITHUB_OUTPUT"
                exit 0
                ;;

              ERROR|ABORTED|ABORTED_RECOVERING|DISCARDED)
                echo ""
                echo "=========================================="
                echo "FAILED: Boomi Process Execution"
                echo "=========================================="

                echo "Boomi error message:"
                jq -r '.message // "No error message returned"' report-response.json

                echo "status=$STATUS" >> "$GITHUB_OUTPUT"

                exit 1
                ;;

              INPROCESS|STARTED|ENQUEUED)
                echo "Process is still running..."
                sleep "$SLEEP_SECONDS"
                ;;

              *)
                echo "Unknown status: $STATUS"
                sleep "$SLEEP_SECONDS"
                ;;

            esac

          done

          echo "ERROR: Timed out waiting for Boomi Process Report."
          exit 1

      # ---------------------------------------------------------
      # STEP 9 - Upload Boomi Report
      # ---------------------------------------------------------
      - name: Upload Boomi Process Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boomi-process-report
          path: |
            deploy-response.json
            execution-response.json
            report-response.json
          if-no-files-found: ignore

      # ---------------------------------------------------------
      # STEP 10 - Final Summary
      # ---------------------------------------------------------
      - name: Deployment Summary
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "Boomi CI/CD Pipeline Summary"
          echo "=========================================="
          echo "Process       : ${{ steps.manifest.outputs.process }}"
          echo "Release       : ${{ steps.manifest.outputs.release }}"
          echo "Deployment ID : ${{ steps.deploy.outputs.deployment_id }}"
          echo "Package ID    : ${{ steps.deploy.outputs.package_id }}"
          echo "Request ID    : ${{ steps.execute.outputs.request_id }}"
          echo "Report Status : ${{ steps.report.outputs.status }}"
          echo "=========================================="
